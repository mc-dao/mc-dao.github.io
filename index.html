<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCDAO · 发布页</title>
<meta name="description" content="MCDAO发布页，提供全部可用线路。">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#f4f7ef">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%236f9a10'/%3E%3Ccircle cx='16' cy='16' r='6' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <h1 class="logo" id="site-name">站点导航</h1>
      <p class="notice">按 <kbd>Ctrl</kbd><span class="plus">+</span><kbd>D</kbd><span>收藏本页 · 防止失联</span></p>
      <p class="tagline" id="site-subtitle">正在加载…</p>
      <div class="hero-bar">
        <span class="live" id="check-info">正在获取线路状态…</span>
        <button class="btn-check" id="refresh" type="button">重新检测</button>
      </div>
    </header>

    <main id="groups" aria-live="polite"></main>

    <p class="empty" id="all-down" hidden>当前网络下所有线路均不可达，请稍后重新检测</p>

    <footer class="foot">
      <p id="site-footer"></p>
      <p class="mono" id="site-domain"></p>
    </footer>
  </div>
  <script src="/app.js" defer></script>
</body>
</html>
